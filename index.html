<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<title>Bluetooth Arduino</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="app">
  <div class="alert" id="unsupportedAlert" hidden>
    Este navegador no soporta Web Bluetooth. Usa Chrome o Edge (en Linux activa
    <b>chrome://flags → Experimental Web Platform features</b>).
  </div>

  <section class="card connection">
    <div class="connection__status">
      <span class="status-dot" id="statusDot"></span>
      <div>
        <div class="connection__label" id="statusLabel">Desconectado</div>
        <div class="connection__detail" id="statusDetail"></div>
      </div>
    </div>
    <button class="btn btn--primary" id="connectButton">Conectar</button>
  </section>

  <section class="card display">
    <canvas class="display__matrix" id="matrix" aria-label="Vista previa de la matriz"></canvas>
    <div class="display__footer">
      <span class="display__counter" id="counter">0/20</span>
      <span class="led led--off" id="led"><i class="led__dot"></i><span id="ledLabel">Sin conexión</span></span>
    </div>
  </section>

  <section class="card controls">
    <div class="keyboard" id="keyboard"></div>

    <div class="actions">
      <button class="btn btn--danger" id="clearMatrixButton">Borrar matriz</button>
      <button class="btn btn--send" id="sendButton">Enviar</button>
    </div>
  </section>

  <section class="card recent" id="recentCard" hidden>
    <h2 class="card__title">Recientes</h2>
    <div class="chips" id="recentList"></div>
  </section>

  <details class="card activity">
    <summary class="activity__summary">Actividad</summary>
    <ul class="activity__list" id="activityList"></ul>
  </details>
</main>

<script src="js/config.js"></script>
<script src="js/DotFont.js"></script>
<script src="js/LedMatrix.js"></script>
<script src="js/BleClient.js"></script>
<script src="js/Keyboard.js"></script>
<script src="js/RecentList.js"></script>
<script src="js/ActivityLog.js"></script>
<script src="js/App.js"></script>
<script src="js/main.js"></script>
</body>
</html>
